[package]
name = "aluma-bootstrap"
version = "0.1.0"
edition = "2021"

[dependencies]
wry = "0.22"
reqwest = { version = "0.11", features = ["blocking", "rustls-tls"] }
tiny_http = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
